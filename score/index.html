<!-- score.html Serial: #001-EXPERIMENTAL -->
<!DOCTYPE html>
<html>
<head>
    <title>Barbershop Score</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 800px; }
        h1 { margin-top: 0; font-size: 1.1rem; color: #666; }
        .row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        button { cursor: pointer; border: 1px solid #ccc; background: white; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
        button:disabled { opacity: 0.5; cursor: default; }
        .status { font-size: 0.85rem; color: #555; min-height: 1.2em; margin-bottom: 10px; }
        .status.error { color: #c0392b; }
        #dirtyIndicator { font-size: 0.85rem; color: #a15c00; font-weight: bold; }
        .doc-strip { font-size: 0.8rem; }
        #docLabel { color: #888; }
        .strip-btn { padding: 3px 9px; font-size: 0.75rem; border-radius: 4px; font-weight: normal; }
        .strip-nav-link { margin-left: auto; color: #007bff; text-decoration: none; }
        .strip-nav-link:hover { text-decoration: underline; }
        #resumeBanner { background: #eef3ff; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; }
        #resumeBannerText { color: #333; }
        #summary { font-size: 0.9rem; color: #333; margin-bottom: 10px; }
        #warnings { font-size: 0.85rem; color: #a15c00; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; }
        th { color: #666; }
        .vowel-col { width: 2.5em; text-align: center; }
        .vowel-editable { cursor: pointer; }
        .vowel-editable:hover { background: #f5f6f8; text-decoration: underline dotted; }
        .vowel-picker { font-size: 0.85rem; }
        .cents-note { white-space: nowrap; }
        tr.measure-row td { background: #f5f6f8; color: #888; font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-bottom: 1px solid #e1e4e8; }
        .row-action-btn { font-size: 0.7rem; padding: 2px 6px; font-weight: normal; margin-left: 4px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: white; border-radius: 12px; padding: 20px; width: 560px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-box .row { flex-wrap: wrap; }
        #pickerFixRow label { display: flex; align-items: center; gap: 4px; }
        #pickerFixRow input { width: 55px; }
        #pickerResults { overflow-y: auto; border: 1px solid #eee; border-radius: 6px; flex: 1; min-height: 100px; }
        .picker-result { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 0.85rem; }
        .picker-result:hover { background: #f5f6f8; }
        .picker-result:last-child { border-bottom: none; }
        .picker-result-notes { color: #666; font-size: 0.8rem; }
        .picker-result-tentative { color: #a15c00; font-size: 0.75rem; }
        .picker-result-revoice-btn { font-size: 0.7rem; padding: 2px 6px; font-weight: normal; margin-left: 8px; flex-shrink: 0; }
        #scoreRevoiceOverlay { z-index: 101; }
        #revoiceNotation { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; align-self: center; }
        .revoice-octave-col { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.8rem; color: #555; background: #f8f9fa; border-radius: 8px; padding: 8px 12px; }
        .revoice-octave-col button { padding: 2px 10px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Barbershop Score — MusicXML import (experimental)</h1>
    <div class="row doc-strip">
        <span id="docLabel">No score loaded</span>
        <span id="dirtyIndicator"></span>
        <button id="undoBtn" class="strip-btn" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
        <button id="redoBtn" class="strip-btn" disabled title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
        <button id="newScoreBtn" class="strip-btn" title="Start a new, empty score">+ New score</button>
        <a href="../" class="strip-nav-link">← Chord page</a>
    </div>
    <div class="row" id="resumeBanner" style="display: none;">
        <span id="resumeBannerText"></span>
        <button id="resumeBtn" class="strip-btn">Resume</button>
        <button id="dismissResumeBtn" class="strip-btn">Dismiss</button>
    </div>
    <div class="row">
        <input type="file" id="xmlFile" accept=".xml,.musicxml">
        <button id="exportBtn" disabled>Export score</button>
    </div>
    <div class="row" style="font-size: 0.85rem;">
        <label for="retuneIntonation">Re-tune all chords to:</label>
        <select id="retuneIntonation">
            <option value="just" selected>Just</option>
            <option value="pythagorean">Pythagorean</option>
            <option value="equal">Equal</option>
        </select>
        <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
            <input type="checkbox" id="retuneRootless"> Allow rootless 9ths
        </label>
        <button id="retuneBtn" disabled title="Recomputes cents for every chord using the offline theory engine — overwrites any existing cents, including manual ones">Re-tune All</button>
    </div>
    <div class="row" style="font-size: 0.85rem; flex-wrap: wrap;">
        <label for="scoreBpm">Tempo: <input type="number" id="scoreBpm" value="120" min="20" max="300" style="width: 55px;"> BPM</label>
        <button id="playScoreBtn" disabled>▶ Play Score</button>
        <button id="stopScoreBtn" disabled>■ Stop</button>
        <button id="saveScoreWavBtn" disabled>💾 Save Score .wav</button>
        <span id="scorePlaybackStatus" style="color: #888;"></span>
    </div>
    <div class="row" style="font-size: 0.8rem; flex-wrap: wrap;">
        <span style="color: #666; font-weight: bold;">Mix:</span>
        <label style="display: flex; align-items: center; gap: 4px;">Tenor
            <input type="range" id="mix-vol-3" min="0" max="1" step="0.05" value="1" style="width: 60px;">
            <input type="checkbox" id="mix-mute-3" title="Mute Tenor"> Mute
        </label>
        <label style="display: flex; align-items: center; gap: 4px;">Lead
            <input type="range" id="mix-vol-2" min="0" max="1" step="0.05" value="1" style="width: 60px;">
            <input type="checkbox" id="mix-mute-2" title="Mute Lead"> Mute
        </label>
        <label style="display: flex; align-items: center; gap: 4px;">Bari
            <input type="range" id="mix-vol-1" min="0" max="1" step="0.05" value="1" style="width: 60px;">
            <input type="checkbox" id="mix-mute-1" title="Mute Bari"> Mute
        </label>
        <label style="display: flex; align-items: center; gap: 4px;">Bass
            <input type="range" id="mix-vol-0" min="0" max="1" step="0.05" value="1" style="width: 60px;">
            <input type="checkbox" id="mix-mute-0" title="Mute Bass"> Mute
        </label>
        <span style="color: #999;">(mix and mute are for listening only — not saved with the score)</span>
    </div>
    <div id="status" class="status"></div>
    <div id="summary"></div>
    <div id="warnings"></div>
    <table>
        <thead>
            <tr><th>#</th><th>Beats</th><th>Name</th><th class="vowel-col">Vowel</th><th>Tenor</th><th>Lead</th><th>Bari</th><th>Bass</th><th></th></tr>
        </thead>
        <tbody id="chords"></tbody>
    </table>
    <div class="row" style="margin-top: 10px;">
        <button id="appendChordBtn" disabled>+ Add chord</button>
    </div>
</div>

<div id="chordPickerOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <div class="row" style="justify-content: space-between; margin-bottom: 5px;">
            <strong id="pickerTargetLabel"></strong>
            <button id="pickerCloseBtn" class="strip-btn">✕ Close</button>
        </div>
        <div class="row" style="font-size: 0.85rem;">
            <label for="pickerNameInput">Chord name:</label>
            <input type="text" id="pickerNameInput" placeholder="e.g. Cm7" style="width: 90px;">
            <label for="pickerBeatsInput">Beats:</label>
            <input type="number" id="pickerBeatsInput" value="1" min="0.25" step="0.25" style="width: 55px;">
            <button id="pickerSearchBtn">Search</button>
        </div>
        <div class="row" id="pickerFixRow" style="font-size: 0.8rem;">
            <span style="color: #666;">Fix specific notes (optional):</span>
            <label>Tenor <input type="text" id="pickerFix-3" placeholder="e.g. C4"></label>
            <label>Lead <input type="text" id="pickerFix-2" placeholder="e.g. C4"></label>
            <label>Bari <input type="text" id="pickerFix-1" placeholder="e.g. C4"></label>
            <label>Bass <input type="text" id="pickerFix-0" placeholder="e.g. C4"></label>
        </div>
        <div id="pickerStatus" class="status"></div>
        <div id="pickerResults"></div>
    </div>
</div>

<div id="scoreRevoiceOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <div class="row" style="justify-content: space-between; margin-bottom: 5px;">
            <strong>Revoice candidate</strong>
            <button id="revoiceCloseBtn" class="strip-btn">✕ Close</button>
        </div>
        <div id="revoiceNotation"></div>
        <div>
            <div style="font-size: 0.85rem; color: #666; margin-bottom: 4px;">Swap two parts' notes:</div>
            <div id="revoiceSwaps" class="row"></div>
        </div>
        <div>
            <div style="font-size: 0.85rem; color: #666; margin-bottom: 4px;">Bump a part an octave:</div>
            <div id="revoiceOctaves" class="row"></div>
        </div>
        <div class="row" style="justify-content: flex-end;">
            <button id="revoiceCancelBtn">Cancel</button>
            <button id="revoiceApplyBtn" style="background: #6f42c1; color: white; border: none;">Apply</button>
        </div>
    </div>
</div>
<script src="../engine/barbershop-engine.js"></script>
<script type="module" src="../static/js/score.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('../sw.js').then(reg => {
                console.log('SW Registered');
            }).catch(err => console.log('SW Registration failed', err));
        });
    }
</script>
</body>
</html>

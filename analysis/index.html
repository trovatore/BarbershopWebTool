<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop Spectral Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: #333; margin-top: 0; }
        .chart-container { position: relative; height: 500px; width: 100%; }
        .peak-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th { text-align: left; background: #eee; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
        .part-Bass { color: #d32f2f; } .part-Bari { color: #f57c00; }
        .part-Lead { color: #388e3c; } .part-Tenor { color: #1976d2; }
        .part-Summed { color: #333; font-weight: bold; }
        .summed-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 0.95rem; color: #444; }
        .summed-toggle input { width: 16px; height: 16px; }
        @media (max-width: 600px) { .chart-container { height: 350px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Spectrum Analysis</h1>
            <label class="summed-toggle">
                <input type="checkbox" id="showSummedToggle">
                Show summed spectrum
            </label>
            <div class="chart-container"><canvas id="spectrumChart"></canvas></div>
        </div>
        <div id="peakContainer" class="peak-tables"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js').then(reg => {
                    console.log('SW Registered');
                }).catch(err => console.log('SW Registration failed', err));
            });
        }
    </script>

    <script>
        const data = JSON.parse(localStorage.getItem('chordAnalysisData'));
        if (!data) {
            document.body.innerHTML = "<div class='container'><h1>No analysis data found.</h1></div>";
            throw new Error("No data");
        }

        // --- Helper: Frequency to Semitone ---
        function freqToSemi(f) { return 12 * Math.log2(f / 440) + 57; }
        function semiToFreq(s) { return 440 * Math.pow(2, (s - 57) / 12); }

        // --- 1. Stable Vertical Scaling (Multiples of 5dB, Fixed Range) ---
        // Always computed from every part's magnitudes, including Summed, even though Summed's
        // line is hidden by default -- so toggling "Show summed spectrum" never itself rescales
        // the y-axis and jumps the other lines around.
        const allMagnitudes = data.parts.flatMap(p => p.magnitudes);
        const globalMax = Math.max(...allMagnitudes);

        // Snap the top to the next 5dB multiple
        const yMax = Math.ceil((globalMax + 2) / 5) * 5;
        // Fixed 95dB depth provides a stable vertical window
        const yMin = yMax - 95;

        // --- 2. Horizontal scaling: a priori, from audio.js's own computeFundamentals()-derived
        // bounds (plan.md §48) -- not from whatever findPeaksNearCandidates() happens to detect on
        // this particular render, so the axis itself can't shift between two "Analyze" clicks on
        // the identical chord the way it could when it was peak-derived.
        const xAxisMin = data.xAxisMin;
        const xAxisMax = data.xAxisMax;
        const startSemi = Math.round(freqToSemi(xAxisMin));
        const endSemi = Math.ceil(freqToSemi(xAxisMax));

        // --- Custom Tick Generator ---
        function getNoteName(freq) {
            const names = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
            const semis = freqToSemi(freq);
            const rounded = Math.round(semis);
            return {
                name: names[((rounded % 12) + 12) % 12],
                octave: Math.floor(rounded / 12),
                semitone: rounded
            };
        }

        const ticks = [];
        for (let n = startSemi; n <= endSemi; n++) {
            ticks.push(semiToFreq(n));
        }

        // --- Chart setup ---
        const ctx = document.getElementById('spectrumChart').getContext('2d');
        const colors = { 'Bass': '#d32f2f', 'Bari': '#f57c00', 'Lead': '#388e3c', 'Tenor': '#1976d2', 'Summed': '#333' };
        const BLEND_COLOR = '#616161'; // a summed-signal peak whose meta spans more than one voice

        // A "ringing" barbershop chord routinely tunes several voices' harmonics to land almost
        // exactly on top of each other (that's the whole point of the tuning) -- which means their
        // lines/dots on this chart land almost exactly on top of each other too. Confirmed live
        // (plan.md §48.4): with fully opaque colors, whichever dataset Chart.js happens to paint
        // last completely hides the others there -- e.g. an orange Bari dot fully covering an
        // exactly-coincident green Lead dot, not just visually blending with it. Real alpha
        // transparency (not just a nominal "we should add some someday") makes a coincidence show
        // as a genuinely blended color instead of silently erasing the other voice's marker.
        const ALPHA = 0.7;
        function withAlpha(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        const partsByName = Object.fromEntries(data.parts.map(p => [p.name, p]));
        const voiceParts = data.parts.filter(p => p.name !== 'Summed');

        // The full FFT has 8192 bins across the whole 0-22kHz Nyquist range; the chart only ever
        // shows [xAxisMin, xAxisMax] (usually well under half of that), and even within that
        // window doesn't need every single bin to look right -- min/max-per-bucket decimation
        // (keep the loudest and quietest sample in each small frequency bucket, which preserves
        // the visual peak/valley shape) caps what actually reaches Chart.js. Drawing 5 lines'
        // worth of raw 8192-point data at once is what caused the several-second freeze found live
        // when the Summed toggle was first tried (plan.md §48) -- tension:0 alone wasn't enough,
        // since the cost is dominated by the sheer number of canvas segments, not curve fitting.
        const MAX_LINE_POINTS = 1200;
        function toPoints(part) {
            const inRange = [];
            for (let i = 0; i < part.magnitudes.length; i++) {
                if (data.freqs[i] < xAxisMin || data.freqs[i] > xAxisMax) continue;
                inRange.push({ x: data.freqs[i], y: part.magnitudes[i] });
            }
            const bucketCount = Math.floor(MAX_LINE_POINTS / 2);
            if (inRange.length <= bucketCount * 2) return inRange;
            const bucketSize = inRange.length / bucketCount;
            const out = [];
            for (let b = 0; b < bucketCount; b++) {
                const start = Math.floor(b * bucketSize), end = Math.floor((b + 1) * bucketSize);
                let lo = inRange[start], hi = inRange[start];
                for (let i = start; i < end; i++) {
                    if (inRange[i].y < lo.y) lo = inRange[i];
                    if (inRange[i].y > hi.y) hi = inRange[i];
                }
                // Keep the pair in frequency order so the line doesn't zigzag backward.
                if (lo.x <= hi.x) { out.push(lo, hi); } else { out.push(hi, lo); }
            }
            return out;
        }

        // The full a priori harmonic search intentionally goes quite high (plan.md §48) so the
        // plot's dots/lines don't clip a genuinely high chord's real content -- but a peak *table*
        // listing dozens of high, quiet harmonics per voice is just clutter, not information.
        // Trim what the LISTS show (not the plot, which stays as-searched) to within 3.5 octaves of
        // the chord's own highest fundamental, then cap each list at its 10 loudest survivors.
        // Mike's own framing: harmless in the plot, confusing to remove there, but not worth
        // listing.
        const LIST_OCTAVE_LIMIT = 3.5;
        const LIST_MAX_PEAKS = 10;
        const highestFundamental = Math.max(...data.fundamentals.map(f => f.freq));
        const listCutoffFreq = highestFundamental * Math.pow(2, LIST_OCTAVE_LIMIT);
        function peaksForList(part) {
            return part.peaks
                .filter(pk => pk.freq <= listCutoffFreq)
                .slice() // sort() is in-place; don't disturb the plot's own freq-ascending order
                .sort((a, b) => b.db - a.db)
                .slice(0, LIST_MAX_PEAKS)
                .sort((a, b) => a.freq - b.freq);
        }

        // A peak's meta is a list of { voice, harmonic } contributions -- more than one distinct
        // voice means this dot represents a blended peak (plan.md §48 item 3).
        function peakColor(part, pk) {
            if (part.name !== 'Summed') return withAlpha(colors[part.name], ALPHA);
            const voices = new Set(pk.meta.map(m => m.voice));
            return withAlpha(voices.size > 1 ? BLEND_COLOR : colors[pk.meta[0].voice], ALPHA);
        }

        // Built once, up front -- every dataset (including Summed) is created here and its
        // visibility toggled afterward via each dataset's own .hidden flag, never by reassigning
        // chart.data.datasets wholesale. Chart.js identifies a dataset across updates by object
        // identity/array position; replacing the array with brand-new objects (even ones holding
        // the exact same points) makes it re-parse every point from scratch on the next update(),
        // not just the changed one. Line datasets also use tension: 0 (straight segments, not the
        // default bezier curve) -- cubic interpolation is the most expensive part of drawing an
        // 8000+ point line, and raw FFT bin-to-bin data has no real curvature to represent anyway.
        // Both together are the difference between a toggle click resolving instantly and one that
        // visibly freezes the tab for several seconds -- caught live (plan.md §48), not by unit
        // tests, which have no notion of wall-clock render cost.
        const summed = partsByName['Summed'];
        const lineDatasets = voiceParts.map(p => ({
            label: p.name,
            data: toPoints(p),
            borderColor: withAlpha(colors[p.name], ALPHA),
            borderWidth: 1.2,
            pointRadius: 0,
            fill: false,
            tension: 0
        }));
        const dotDatasets = voiceParts.map(p => ({
            label: p.name + ' peaks',
            data: p.peaks.map(pk => ({ x: pk.freq, y: pk.db })),
            showLine: false,
            pointRadius: 5,
            pointBackgroundColor: withAlpha(colors[p.name], ALPHA),
            pointBorderColor: '#fff',
            pointBorderWidth: 1,
            fill: false
        }));
        const summedLine = {
            label: 'Summed',
            data: toPoints(summed),
            borderColor: withAlpha(colors['Summed'], ALPHA),
            borderWidth: 2.5,
            pointRadius: 0,
            fill: false,
            tension: 0,
            hidden: true
        };
        const summedDots = {
            label: 'Summed peaks',
            data: summed.peaks.map(pk => ({ x: pk.freq, y: pk.db })),
            showLine: false,
            pointRadius: 5,
            pointBackgroundColor: summed.peaks.map(pk => peakColor(summed, pk)),
            pointBorderColor: '#fff',
            pointBorderWidth: 1,
            fill: false,
            hidden: true
        };

        const chart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [...lineDatasets, summedLine, ...dotDatasets, summedDots] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                parsing: false,
                scales: {
                    x: {
                        type: 'logarithmic',
                        min: xAxisMin,
                        max: xAxisMax,
                        title: { display: true, text: 'Note Scale' },
                        grid: {
                            color: (context) => {
                                if (!context.tick) return '#eee';
                                const note = getNoteName(context.tick.value);
                                return (note.semitone % 12 === 0) ? '#ccc' : '#f4f4f4';
                            },
                            lineWidth: (context) => (context.tick && getNoteName(context.tick.value).semitone % 12 === 0) ? 2 : 1
                        },
                        afterBuildTicks: (axis) => {
                            axis.ticks = ticks.map(v => ({ value: v }));
                        },
                        ticks: {
                            callback: function(value) {
                                const note = getNoteName(value);
                                if ([0, 4, 8].includes(((note.semitone % 12) + 12) % 12)) {
                                    return note.name + note.octave;
                                }
                                return "";
                            },
                            maxRotation: 0,
                            autoSkip: false
                        }
                    },
                    y: {
                        min: yMin,
                        max: yMax,
                        title: { display: true, text: 'Magnitude (dB)' },
                        ticks: { stepSize: 5 },
                        grid: {
                            color: (c) => c.tick.value % 10 === 0 ? '#ddd' : '#f0f0f0',
                            lineWidth: (c) => c.tick.value % 10 === 0 ? 1.5 : 1
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                        // "Summed"/"Summed peaks" are controlled solely by the dedicated checkbox
                        // above the chart, not by the legend's own default click-to-toggle -- one
                        // control for one piece of state, rather than two that could disagree.
                        labels: { filter: (item) => !item.text.endsWith(' peaks') && item.text !== 'Summed' }
                    },
                    tooltip: {
                        callbacks: {
                            title: (items) => {
                                const f = items[0].parsed.x;
                                const n = getNoteName(f);
                                return `${f.toFixed(1)} Hz (${n.name}${n.octave})`;
                            }
                        }
                    }
                }
            }
        });

        // --- Peak Table Rendering ---
        // Always shows every part, Summed included, independent of the plot's own toggle -- the
        // Summed table stays informative (e.g. checking for a blended peak) even while its line/
        // dots are hidden from the chart.
        const peakDiv = document.getElementById('peakContainer');
        function metaLabel(pk) {
            return pk.meta.map(m => `${m.voice} h${m.harmonic}`).join(', ');
        }
        data.parts.forEach(p => {
            const isSummed = p.name === 'Summed';
            let html = `<div class="card"><h2 class="part-${p.name}">${p.name} Peaks</h2><table>
                <thead><tr><th>#</th><th>Freq</th><th>Note</th><th>dB</th>${isSummed ? '<th>Voices</th>' : ''}</tr></thead><tbody>`;
            peaksForList(p).forEach((pk, i) => {
                const cents = pk.cents >= 0 ? "+" + pk.cents : pk.cents;
                html += `<tr><td>${i+1}</td><td>${pk.freq}Hz</td><td><strong>${pk.note}</strong> (${cents})</td><td>${pk.db}</td>${isSummed ? `<td>${metaLabel(pk)}</td>` : ''}</tr>`;
            });
            html += `</tbody></table></div>`;
            peakDiv.innerHTML += html;
        });

        // --- Toggle wiring ---
        // Swaps which lines the plot shows -- Summed replaces the per-voice lines, not layers on
        // top of them, so the chart isn't a tangle of both at once. Every dot dataset (per-voice
        // AND Summed's own) stays visible either way: dots are cheap, and seeing each voice's own
        // peak alongside a blended Summed peak is exactly what makes a blend legible on the chart.
        document.getElementById('showSummedToggle').addEventListener('change', (e) => {
            const showSummed = e.target.checked;
            lineDatasets.forEach(d => { d.hidden = showSummed; });
            summedLine.hidden = !showSummed;
            summedDots.hidden = !showSummed;
            chart.update();
        });
    </script>
</body>
</html>
